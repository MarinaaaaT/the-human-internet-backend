[package]
name = "human-internet-signing-lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
aws-config = "1"
aws-sdk-kms = "1"
aws-sdk-ssm = "1"
c2pa = "0.90"
p256 = "0.13"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
# Test-only: mints a throwaway CA + leaf at test time so the manifest tests
# can sign without a KMS key and without committing any private key.
rcgen = "0.13"
serde_json = "1"

[profile.release]
strip = true
lto = true
