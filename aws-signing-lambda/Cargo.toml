[package]
name = "human-internet-signing-lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
aws-config = "1"
aws-sdk-kms = "1"
aws-sdk-ssm = "1"
c2pa = { version = "0.90", features = ["add_thumbnails"] }
p256 = "0.13"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# `/capture`'s claim thumbnail (src/thumbnail.rs): unlike image's own JPEG
# decoder (zune-jpeg), this one can decode at 1/2, 1/4 or 1/8 scale. Pure
# Rust, from the image-rs project; no rayon, which the Lambda's single vCPU
# can't use.
jpeg-decoder = { version = "0.3", default-features = false }
# The Storage hand-off (src/handoff.rs). Already in the tree via c2pa; rustls,
# so the image needs no system OpenSSL for it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Test-only: mints a throwaway CA + leaf at test time so the manifest tests
# can sign without a KMS key and without committing any private key.
rcgen = "0.13"

[profile.release]
strip = true
lto = true
